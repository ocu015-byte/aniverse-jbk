<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniVerse JBK</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui; background: #0b0b14; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { background: linear-gradient(135deg, #ff2d78, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .container { width: 100%; max-width: 800px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .card { background: #1e1e2e; padding: 10px; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
    .card img, .card video { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    .btn { background: #2a2a3d; border: none; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
    .btn-primary { background: #ff2d78; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; }
    .modal.open { display: flex; }
    .modal-box { background: #1e1e2e; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; }
    .input-group { margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0b0b14; color: white; box-sizing: border-box;}
    .upload-preview { width: 100%; height: 150px; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 10px; }
    .preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .preview-img.show { display: block; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AniVerse JBK</h1>
      <div>
        <button class="btn btn-primary" onclick="App.openUpload()">+ Publicar</button>
      </div>
    </div>
    <div id="status" style="color:#888; margin-bottom:10px;">☁️ Conectando...</div>
    <div class="grid" id="gallery"></div>
  </div>

  <!-- Modal Subir -->
  <div class="modal" id="modal-upload">
    <div class="modal-box">
      <h3>Subir Contenido</h3>
      <div class="input-group"><input type="text" id="title" placeholder="Título de la obra" /></div>
      <div class="input-group">
        <div class="upload-preview" onclick="document.getElementById('file').click()">
          <span id="preview-text">Haz clic para seleccionar</span>
          <img id="preview-img" class="preview-img" />
        </div>
        <input type="file" id="file" accept="image/*,video/*" hidden />
      </div>
      <div class="actions">
        <button class="btn" onclick="App.closeUpload()">Cancelar</button>
        <button class="btn btn-primary" id="btn-publish" onclick="App.publish()">Publicar</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE (¡Cámbialo aquí!)
    // ==========================================
    const supabaseUrl = 'https://iqpucamkfdisjmuamhfe.supabase.co';
    // VE A SUPABASE -> PROJECT SETTINGS -> API -> COPIA TU CLAVE "anon" AQUÍ ABAJO:
    const supabaseKey = 'AQUI_PON_TU_CLAVE_ANON_REAL_QUE_EMPIEZA_POR_EYJ'; 
    const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

    const App = {
      async init() {
        const { data: { session } } = await sb.auth.getSession();
        this.user = session?.user || null;
        await this.loadPosts();
      },

      async loadPosts() {
        try {
          const { data, error } = await sb.from('posts').select('*, likes(count)').order('created_at', { ascending: false });
          if(error) throw error;
          document.getElementById('status').textContent = '☁️ Conectado';
          this.renderGallery(data || []);
        } catch(e) {
          console.error(e);
          document.getElementById('status').textContent = '❌ Error de conexión (F12 para ver el error)';
        }
      },

      renderGallery(posts) {
        const grid = document.getElementById('gallery');
        if(!posts.length) { grid.innerHTML = '<p style="grid-column: 1/-1; color:#666; text-align:center;">Aún no hay publicaciones. ¡Sé el primero!</p>'; return; }
        
        grid.innerHTML = posts.map(p => `
          <div class="card">
            ${p.type === 'video' ? `<video src="${p.file_url}" muted></video>` : `<img src="${p.file_url}" loading="lazy" />`}
            <div style="display:flex; justify-content:space-between; padding-top:8px;">
              <strong style="font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.title}</strong>
              <span style="font-size:13px; color:#888;">❤️ ${p.likes?.[0]?.count || 0}</span>
            </div>
          </div>
        `).join('');
      },

      openUpload() {
        document.getElementById('modal-upload').classList.add('open');
        document.getElementById('preview-img').classList.remove('show');
        document.getElementById('preview-text').style.display = 'block';
        document.getElementById('file').value = '';
        document.getElementById('title').value = '';
        this._file = null;
      },
      closeUpload() { document.getElementById('modal-upload').classList.remove('open'); },

      async publish() {
        const title = document.getElementById('title').value.trim();
        const fileInput = document.getElementById('file');
        if(!title || !fileInput.files.length) return alert('Falta el título o el archivo');
        
        const btn = document.getElementById('btn-publish');
        btn.disabled = true; btn.textContent = 'Subiendo...';

        try {
          const file = fileInput.files[0];
          const ext = file.name.split('.').pop();
          const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
          
          // Subir a Storage
          const { error: uploadError } = await sb.storage.from('media').upload(path, file);
          if(uploadError) throw uploadError;

          const { data: publicUrl } = sb.storage.from('media').getPublicUrl(path);
          const type = file.type.startsWith('video') ? 'video' : 'image';

          // Insertar en la tabla
          const { error: insertError } = await sb.from('posts').insert({ 
            title, type, file_url: publicUrl.publicUrl, user_id: this.user?.id 
          });
          if(insertError) throw insertError;

          this.closeUpload();
          this.loadPosts();
        } catch(e) {
          console.error(e);
          alert('Error: ' + e.message);
        } finally {
          btn.disabled = false; btn.textContent = 'Publicar';
        }
      }
    };

    // Configurar previsualización de archivo
    document.getElementById('file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const preview = document.getElementById('preview-img');
      const text = document.getElementById('preview-text');
      preview.src = URL.createObjectURL(file);
      preview.classList.add('show');
      text.style.display = 'none';
    });

    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
