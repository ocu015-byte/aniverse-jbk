<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVerse JBK | Galería Anime 2026</title>
    <link rel="icon" href="logo.png">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #14141c; --primary: #ff0055;
            --secondary: #00e5ff; --text: #e0e0e0; --muted: #6b6b7b;
            --success: #00ff88;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

        header {
            padding:15px 30px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(10,10,15,0.95); border-bottom:1px solid rgba(255,255,255,0.05);
            position:sticky; top:0; z-index:100; backdrop-filter:blur(10px);
        }
        .logo { font-size:26px; font-weight:900; letter-spacing:-1px; display:flex; align-items:center; gap:10px; }
        .logo img { width:28px; height:28px; border-radius:6px; object-fit:cover; }
        .logo span { color:var(--primary); }
        .logo small { font-size:11px; color:var(--secondary); font-weight:600; vertical-align:super; margin-left:4px; }

        button {
            padding:8px 20px; border:none; border-radius:8px; cursor:pointer;
            font-weight:700; font-size:13px; transition:all 0.2s;
        }
        .btn-primary { background:var(--primary); color:white; }
        .btn-primary:hover { filter:brightness(1.2); }
        .btn-secondary { background:var(--surface); color:var(--text); border:1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { border-color:var(--text); }
        .btn-upload { background:var(--secondary); color:#000; }
        .btn-upload:hover { filter:brightness(1.1); }
        .btn-download { background:var(--success); color:#000; display:inline-flex; align-items:center; gap:6px; }
        .btn-download:hover { filter:brightness(1.1); transform:translateY(-1px); }

        .gallery-header { padding:30px 30px 10px; }
        .gallery-grid {
            padding:20px 30px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:20px; flex:1;
        }

        .empty-state { grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--muted); }
        .empty-icon { font-size:64px; margin-bottom:20px; opacity:0.5; }
        .empty-title { font-size:22px; color:var(--text); margin-bottom:10px; }
        .empty-desc { font-size:15px; max-width:400px; margin:0 auto; line-height:1.6; }

        .card {
            background:var(--surface); border-radius:14px; overflow:hidden; position:relative;
            aspect-ratio:3/4; transition:transform 0.3s; cursor:pointer;
        }
        .card:hover { transform:translateY(-5px); }
        .card img { width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none; }
        .card-info {
            position:absolute; bottom:0; left:0; right:0; padding:15px;
            background:linear-gradient(to top,rgba(0,0,0,0.9),transparent); pointer-events:none;
        }
        .card-title { font-weight:700; font-size:16px; }

        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200;
            display:none; align-items:center; justify-content:center; backdrop-filter:blur(5px);
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--surface); padding:35px; border-radius:16px; width:90%; max-width:450px;
            border:1px solid rgba(255,255,255,0.08);
        }
        .modal h3 { margin-bottom:20px; font-size:22px; }
        .preview-area {
            width:100%; height:200px; border:2px dashed rgba(255,255,255,0.15); border-radius:12px;
            display:flex; align-items:center; justify-content:center; margin-bottom:16px;
            color:var(--muted); font-size:14px; overflow:hidden; cursor:pointer;
        }
        .preview-area img { width:100%; height:100%; object-fit:cover; display:none; }
        .preview-area.has-image img { display:block; }
        .preview-area.has-image span { display:none; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
        .form-group input {
            width:100%; padding:12px 16px; background:var(--bg); border:1px solid rgba(255,255,255,0.1);
            border-radius:8px; color:white; font-size:15px; outline:none; transition:border 0.2s;
        }
        .form-group input:focus { border-color:var(--secondary); }
        .modal-actions { display:flex; gap:10px; margin-top:20px; }
        .modal-actions button { flex:1; padding:12px; }

        .lightbox {
            position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:300;
            display:none; align-items:center; justify-content:center; flex-direction:column; gap:15px;
        }
        .lightbox.active { display:flex; }
        .lightbox img { max-height:80vh; max-width:90vw; border-radius:8px; }
        .lb-close { position:absolute; top:25px; right:30px; font-size:36px; color:white; cursor:pointer; background:none; border:none; }
        .lb-actions { display:flex; gap:10px; align-items:center; }
        .lb-title { font-size:16px; color:var(--muted); margin-right:10px; }

        footer {
            text-align:center; padding:30px; border-top:1px solid rgba(255,255,255,0.05);
            font-size:13px; color:var(--muted);
        }
        footer strong { color:var(--text); }

        .toast {
            position:fixed; bottom:20px; right:20px; background:var(--surface);
            border-left:3px solid var(--success); padding:12px 20px; border-radius:8px;
            font-size:14px; z-index:400; animation:slideIn 0.3s ease;
            box-shadow:0 5px 20px rgba(0,0,0,0.5);
        }
        @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="JBK Logo">
            Ani<span>Verse</span><small>JBK</small>
        </div>
        <button class="btn-upload" onclick="App.openUpload()">＋ Publicar Imagen</button>
    </header>

    <div class="gallery-header">
        <h2 style="font-size:24px;">Galería de la Comunidad</h2>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>

    <!-- MODAL PUBLICAR -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <h3>Publicar en AniVerse JBK</h3>
            <div class="preview-area" id="preview-area" onclick="document.getElementById('file-input').click()">
                <span>Haz clic para seleccionar imagen</span>
                <img id="preview-img">
            </div>
            <input type="file" id="file-input" accept="image/*" hidden>
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="upload-title" placeholder="Ej: Naruto Sage Mode">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="App.closeUpload()">Cancelar</button>
                <button class="btn-primary" onclick="App.publishImage()">Publicar</button>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX CON DESCARGA -->
    <div class="lightbox" id="lightbox" onclick="if(event.target===this)App.closeLightbox()">
        <button class="lb-close" onclick="App.closeLightbox()">&times;</button>
        <img id="lb-img">
        <div class="lb-actions">
            <span class="lb-title" id="lb-title"></span>
            <button class="btn-download" onclick="App.downloadCurrent()">⬇ Descargar</button>
        </div>
    </div>

    <footer>
        &copy; <strong>2026 JBK</strong>. Todos los derechos reservados.<br>
        Plataforma creada y operada por <strong>JBK</strong>. Las imágenes son propiedad de sus respectivos autores.
    </footer>

<script>
const DB = {
    getImages() { return JSON.parse(localStorage.getItem('jbk_images') || '[]'); },
    saveImages(i) { localStorage.setItem('jbk_images', JSON.stringify(i)); }
};

const App = {
    pendingImage: null,
    currentImage: null,

    init() { this.renderGallery(); },

    renderGallery() {
        const grid = document.getElementById('gallery-grid');
        const images = DB.getImages().sort((a,b) => b.id - a.id);

        if (!images.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🖼️</div>
                    <div class="empty-title">La galería está vacía</div>
                    <div class="empty-desc">Sé el primero en publicar. Haz clic en <strong>"＋ Publicar Imagen"</strong> para subir tu arte anime favorito.</div>
                </div>`;
            return;
        }

        grid.innerHTML = images.map(img => `
            <div class="card" onclick="App.openLightbox('${img.img}','${img.title.replace(/'/g,"\\'")}')">
                <img src="${img.img}" alt="${img.title}" loading="lazy">
                <div class="card-info"><div class="card-title">${img.title}</div></div>
            </div>
        `).join('');
    },

    openLightbox(src, title) {
        this.currentImage = { src, title };
        document.getElementById('lb-img').src = src;
        document.getElementById('lb-title').textContent = title;
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    },

    closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
        this.currentImage = null;
    },

    downloadCurrent() {
        if (!this.currentImage) return;
        const link = document.createElement('a');
        link.href = this.currentImage.src;
        const safeName = this.currentImage.title.replace(/[^a-zA-Z0-9áéíóúñü\s]/gi,'').replace(/\s+/g,'_').toLowerCase();
        link.download = `${safeName}_aniverse-jbk.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.toast(`⬇ Descargando: ${this.currentImage.title}`);
    },

    openUpload() {
        this.pendingImage = null;
        document.getElementById('upload-title').value = '';
        document.getElementById('preview-area').classList.remove('has-image');
        document.getElementById('preview-img').src = '';
        document.getElementById('upload-modal').classList.add('active');
    },

    closeUpload() { document.getElementById('upload-modal').classList.remove('active'); },

    publishImage() {
        const title = document.getElementById('upload-title').value.trim();
        if (!title) { this.toast('⚠️ Escribe un título'); return; }
        if (!this.pendingImage) { this.toast('⚠️ Selecciona una imagen primero'); return; }
        const images = DB.getImages();
        images.push({ id: Date.now(), title, img: this.pendingImage });
        DB.saveImages(images);
        this.closeUpload();
        this.renderGallery();
        this.toast('✅ Imagen publicada en AniVerse JBK');
    },

    toast(msg) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
};

document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { App.toast('⚠️ Máximo 5MB por imagen'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
        App.pendingImage = ev.target.result;
        document.getElementById('preview-img').src = ev.target.result;
        document.getElementById('preview-area').classList.add('has-image');
    };
    reader.readAsDataURL(file);
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { App.closeUpload(); App.closeLightbox(); }
});

App.init();
</script>
</body>
</html>
