<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniVerse JBK | Galería Anime 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0f;--surface:#14141c;--primary:#ff0055;--secondary:#00e5ff;--text:#e0e0e0;--muted:#6b6b7b;--success:#00ff88}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:15px 30px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,.95);border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:0;z-index:100}
.logo{font-size:26px;font-weight:900}.logo span{color:var(--primary)}.logo small{font-size:11px;color:var(--secondary);vertical-align:super;margin-left:4px}
button{padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
button:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,.1)}.btn-upload{background:var(--secondary);color:#000}.btn-download{background:var(--success);color:#000}
.gallery-header{padding:30px 30px 10px;display:flex;justify-content:space-between;align-items:center}
.cloud-status{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
.cloud-status.ok{color:var(--success);background:rgba(0,255,136,.1)}
.cloud-status.bad{color:var(--primary);background:rgba(255,0,85,.1)}
.gallery-grid{padding:20px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;flex:1}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:64px;margin-bottom:20px;opacity:.5}
.empty-title{font-size:22px;color:var(--text);margin-bottom:10px}
.empty-desc{font-size:15px;max-width:400px;margin:0 auto;line-height:1.6}
.card{background:var(--surface);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:3/4;cursor:pointer;transition:transform .3s}
.card:hover{transform:translateY(-5px)}
.card img{width:100%;height:100%;object-fit:cover}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);pointer-events:none}
.card-title{font-weight:700;font-size:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);padding:35px;border-radius:16px;width:90%;max-width:450px}
.modal h3{margin-bottom:20px;font-size:22px}
.preview-area{width:100%;height:200px;border:2px dashed rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--muted);font-size:14px;overflow:hidden;cursor:pointer}
.preview-area img{width:100%;height:100%;object-fit:cover;display:none}
.preview-area.has-image img{display:block}
.preview-area.has-image span{display:none}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:15px;outline:none}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:12px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px}
.lightbox.active{display:flex}
.lightbox img{max-height:80vh;max-width:90vw;border-radius:8px}
.lb-close{position:absolute;top:25px;right:30px;font-size:36px;color:#fff;cursor:pointer;background:none;border:none}
.lb-actions{display:flex;gap:10px;align-items:center}
.lb-title{font-size:16px;color:var(--muted);margin-right:10px}
footer{text-align:center;padding:30px;border-top:1px solid rgba(255,255,255,.05);font-size:13px;color:var(--muted)}
footer strong{color:var(--text)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border-left:3px solid var(--success);padding:12px 20px;border-radius:8px;font-size:14px;z-index:400;max-width:350px}
.toast.error{border-left-color:var(--primary)}
</style>
</head>
<body>
<header>
<div class="logo">Ani<span>Verse</span><small>JBK</small></div>
<button class="btn-upload" onclick="App.openUpload()">＋ Publicar Imagen</button>
</header>
<div class="gallery-header">
<h2 style="font-size:24px">Galería de la Comunidad</h2>
<span class="cloud-status bad" id="cloud-status">⏳ Conectando...</span>
</div>
<div class="gallery-grid" id="gallery-grid"></div>
<div class="modal-overlay" id="upload-modal">
<div class="modal">
<h3>Publicar en AniVerse JBK</h3>
<div class="preview-area" id="preview-area" onclick="document.getElementById('file-input').click()"><span>Haz clic para seleccionar imagen</span><img id="preview-img"></div>
<input type="file" id="file-input" accept="image/*" hidden>
<div class="form-group"><label>Título</label><input type="text" id="upload-title" placeholder="Ej: Naruto Sage Mode"></div>
<div class="modal-actions">
<button class="btn-secondary" onclick="App.closeUpload()">Cancelar</button>
<button class="btn-primary" id="publish-btn" onclick="App.publishImage()">Publicar</button>
</div>
</div>
</div>
<div class="lightbox" id="lightbox" onclick="if(event.target===this)App.closeLightbox()">
<button class="lb-close" onclick="App.closeLightbox()">&times;</button>
<img id="lb-img">
<div class="lb-actions"><span class="lb-title" id="lb-title"></span><button class="btn-download" onclick="App.downloadCurrent()">⬇ Descargar</button></div>
</div>
<footer>&copy; <strong>2026 JBK</strong>. Todos los derechos reservados.<br>Plataforma creada y operada por <strong>JBK</strong>.</footer>
<script>
const sb = window.supabase ? window.supabase.createClient('https://iqpucamkfdisjmuamhfe.supabase.co','sb_publishable_cyPcOMdiqZm__Lvf-qcIIA_tyy-eQK0') : null;
const App={
pendingFile:null,currentImage:null,
async init(){ if(!sb){this.setStatus(false,'⚠️ SDK no cargó');this.render([]);return;} await this.load(); this.realtime(); },
setStatus(ok,txt){const e=document.getElementById('cloud-status');e.textContent=txt;e.className='cloud-status '+(ok?'ok':'bad');},
async load(){ try{ const {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false}); if(error)throw error; this.setStatus(true,'☁️ Nube conectada'); this.render(data||[]); }catch(e){ console.error(e); this.setStatus(false,'⚠️ Error de conexión'); this.render([]); } },
realtime(){ sb.channel('posts-rt').on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>this.load()).subscribe(); },
render(imgs){ const g=document.getElementById('gallery-grid');
 if(!imgs.length){ g.innerHTML='<div class="empty-state"><div class="empty-icon">🖼️</div><div class="empty-title">La galería está vacía</div><div class="empty-desc">Sé el primero en publicar. Haz clic en <strong>"＋ Publicar Imagen"</strong>.</div></div>'; return; }
 g.innerHTML=''; imgs.forEach(p=>{ const c=document.createElement('div'); c.className='card'; c.onclick=()=>this.openLightbox(p.image_url,p.title); const i=document.createElement('img'); i.src=p.image_url; i.alt=p.title; i.loading='lazy'; const n=document.createElement('div'); n.className='card-info'; n.innerHTML='<div class="card-title"></div>'; n.querySelector('.card-title').textContent=p.title; c.append(i,n); g.appendChild(c); }); },
openLightbox(s,t){ this.currentImage={src:s,title:t}; document.getElementById('lb-img').src=s; document.getElementById('lb-title').textContent=t; document.getElementById('lightbox').classList.add('active'); document.body.style.overflow='hidden'; },
closeLightbox(){ document.getElementById('lightbox').classList.remove('active'); document.body.style.overflow=''; this.currentImage=null; },
async downloadCurrent(){ if(!this.currentImage)return; try{ const r=await fetch(this.currentImage.src); const b=await r.blob(); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=this.currentImage.title.replace(/[^a-zA-Z0-9áéíóúñü\s]/gi,'').replace(/\s+/g,'_').toLowerCase()+'_aniverse-jbk.jpg'; a.click(); URL.revokeObjectURL(u); this.toast('⬇ Descargando: '+this.currentImage.title); }catch(e){ this.toast('❌ Error al descargar',1); } },
openUpload(){ this.pendingFile=null; document.getElementById('upload-title').value=''; document.getElementById('preview-area').classList.remove('has-image'); document.getElementById('preview-img').src=''; document.getElementById('upload-modal').classList.add('active'); },
closeUpload(){ document.getElementById('upload-modal').classList.remove('active'); },
async publishImage(){ const title=document.getElementById('upload-title').value.trim(); const btn=document.getElementById('publish-btn');
 if(!title){this.toast('⚠️ Escribe un título');return;} if(!this.pendingFile){this.toast('⚠️ Selecciona una imagen primero');return;}
 btn.disabled=true; btn.textContent='Subiendo...';
 try{ const ext=(this.pendingFile.name.split('.').pop()||'jpg').toLowerCase(); const name=Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+ext;
  const {error:ue}=await sb.storage.from('images').upload(name,this.pendingFile,{contentType:this.pendingFile.type,upsert:false}); if(ue)throw ue;
  const {data:ud}=sb.storage.from('images').getPublicUrl(name);
  const {error:de}=await sb.from('posts').insert([{title:title,image_url:ud.publicUrl}]); if(de)throw de;
  this.closeUpload(); this.toast('✅ Imagen publicada en AniVerse JBK'); await this.load();
 }catch(e){ console.error(e); this.toast('❌ '+(e.message||'No se pudo publicar'),1); }
 finally{ btn.disabled=false; btn.textContent='Publicar'; } },
toast(m,err){ const o=document.querySelector('.toast'); if(o)o.remove(); const t=document.createElement('div'); t.className='toast'+(err?' error':''); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),4000); }
};
document.getElementById('file-input').addEventListener('change',function(e){ const f=e.target.files[0]; if(!f)return; if(f.size>5*1024*1024){App.toast('⚠️ Máximo 5MB por imagen');return;} App.pendingFile=f; const r=new FileReader(); r.onload=ev=>{ document.getElementById('preview-img').src=ev.target.result; document.getElementById('preview-area').classList.add('has-image'); }; r.readAsDataURL(f); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){App.closeUpload();App.closeLightbox();} });
App.init();
</script>
</body>
</html>      Bienvenido
