<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniVerse · JBK 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <style>
    /* ===== RESET Y VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0b14;
      --surface: #181825;
      --surface-2: #22223a;
      --text: #f0f0f5;
      --muted: #8888aa;
      --primary: #ff2d78;
      --secondary: #00e5ff;
      --accent: #b388ff;
      --success: #00ff88;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }

    /* ===== HEADER ===== */
    header {
      padding: 16px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 11, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo small {
      font-size: 12px;
      -webkit-text-fill-color: var(--muted);
      background: none;
      margin-left: 4px;
      vertical-align: super;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ===== BOTONES ===== */
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      background: var(--surface);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
    button:active {
      transform: scale(0.96);
    }
    button:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      box-shadow: 0 0 20px rgba(255, 45, 120, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(255, 45, 120, 0.5);
    }

    .btn-secondary {
      background: var(--secondary);
      color: #000;
      border: none;
    }

    .btn-success {
      background: var(--success);
      color: #000;
      border: none;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: #ff1744;
      color: #fff;
      border: none;
    }

    .btn-sm {
      padding: 4px 12px;
      font-size: 12px;
    }

    /* ===== AUTH MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius);
      width: 95%;
      max-width: 420px;
      box-shadow: var(--shadow);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .modal h2 {
      font-size: 24px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal .form-group {
      margin-bottom: 16px;
    }
    .modal .form-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .modal .form-group input,
    .modal .form-group select,
    .modal .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: var(--transition);
    }
    .modal .form-group input:focus,
    .modal .form-group select:focus,
    .modal .form-group textarea:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
    }
    .modal .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions button {
      flex: 1;
      justify-content: center;
      padding: 12px;
    }

    /* ===== PREVIEW ===== */
    .preview-area {
      width: 100%;
      height: 180px;
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg);
      position: relative;
    }
    .preview-area:hover {
      border-color: var(--secondary);
    }
    .preview-area img,
    .preview-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .preview-area.has-media img,
    .preview-area.has-media video {
      display: block;
    }
    .preview-area.has-media span {
      display: none;
    }

    /* ===== GALERÍA (MASONRY) ===== */
    .gallery-header {
      padding: 24px 30px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .gallery-header h1 {
      font-size: 26px;
      font-weight: 800;
    }
    .gallery-header .cloud-status {
      font-size: 12px;
      padding: 4px 16px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .cloud-status.ok {
      color: var(--success);
      border-color: rgba(0, 255, 136, 0.2);
    }
    .cloud-status.bad {
      color: var(--primary);
      border-color: rgba(255, 45, 120, 0.2);
    }

    .gallery-grid {
      padding: 16px 30px 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      flex: 1;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .card-media {
      width: 100%;
      aspect-ratio: 1/1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-media img,
    .card-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-media .media-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 12px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    .card-info {
      padding: 14px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.3;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .card-meta .likes {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--muted);
      transition: var(--transition);
      background: none;
      border: none;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
    }
    .card-meta .likes:hover {
      color: var(--primary);
    }
    .card-meta .likes.liked {
      color: var(--primary);
    }
    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    /* ===== LIGHTBOX ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox .lb-close {
      position: absolute;
      top: 20px;
      right: 28px;
      font-size: 36px;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      opacity: 0.6;
      transition: var(--transition);
    }
    .lightbox .lb-close:hover {
      opacity: 1;
      transform: rotate(90deg);
    }
    .lightbox .lb-media {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .lightbox .lb-media video,
    .lightbox .lb-media audio {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
    }
    .lightbox .lb-info {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      color: var(--text);
    }
    .lightbox .lb-info .lb-title {
      font-size: 18px;
      font-weight: 600;
    }
    .lightbox .lb-info .lb-actions {
      display: flex;
      gap: 8px;
    }

    /* ===== COMENTARIOS ===== */
    .comments-section {
      width: 90%;
      max-width: 600px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .comments-section .comment {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 14px;
    }
    .comments-section .comment:last-child {
      border-bottom: none;
    }
    .comments-section .comment .user {
      color: var(--secondary);
      font-weight: 600;
      white-space: nowrap;
    }
    .comments-section .comment .content {
      color: var(--text);
      word-break: break-word;
    }
    .comments-section .comment-input {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .comments-section .comment-input input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: var(--bg);
      color: #fff;
      outline: none;
      font-size: 14px;
    }
    .comments-section .comment-input input:focus {
      border-color: var(--secondary);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .empty-state h3 {
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .empty-state p {
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border-left: 4px solid var(--success);
      padding: 14px 22px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 14px;
      z-index: 400;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      animation: slideUp 0.3s ease;
    }
    .toast.error {
      border-left-color: var(--primary);
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13px;
      color: var(--muted);
      margin-top: auto;
    }
    footer strong {
      color: var(--text);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      header {
        padding: 12px 16px;
      }
      .logo {
        font-size: 22px;
      }
      .gallery-grid {
        padding: 12px 16px;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .modal {
        padding: 20px;
      }
      .lightbox .lb-media {
        max-height: 50vh;
      }
      .comments-section {
        width: 95%;
        max-height: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">Ani<span>Verse</span><small>JBK</small></div>
    <div class="header-actions">
      <span id="auth-user" style="font-size:13px;color:var(--muted);display:none;"></span>
      <button id="btn-auth" class="btn-primary" onclick="App.toggleAuth()">🔐 Iniciar sesión</button>
      <button class="btn-secondary" onclick="App.openUpload()">＋ Publicar</button>
    </div>
  </header>

  <!-- ===== GALERÍA ===== -->
  <div class="gallery-header">
    <h1>✨ Comunidad</h1>
    <span class="cloud-status bad" id="cloud-status">⏳ Conectando...</span>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>

  <!-- ===== MODAL AUTH ===== -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h2 id="auth-modal-title">Iniciar sesión</h2>
      <div class="form-group">
        <label>Correo</label>
        <input type="email" id="auth-email" placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="App.toggleAuth()">Cancelar</button>
        <button class="btn-primary" id="auth-submit" onclick="App.submitAuth()">Entrar</button>
      </div>
      <p style="margin-top:12px;font-size:13px;color:var(--muted);text-align:center;">
        <span id="auth-toggle-link" style="color:var(--secondary);cursor:pointer;" onclick="App.switchAuthMode()">¿No tienes cuenta? Regístrate</span>
      </p>
    </div>
  </div>

  <!-- ===== MODAL UPLOAD ===== -->
  <div class="modal-overlay" id="upload-modal">
    <div class="modal">
      <h2>📤 Publicar contenido</h2>
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="upload-title" placeholder="Ej: Mi obra favorita" />
      </div>
      <div class="form-group">
        <label>Tipo de medio</label>
        <select id="upload-type">
          <option value="image">🖼️ Imagen</option>
          <option value="video">🎬 Video</option>
          <option value="audio">🎵 Música</option>
        </select>
      </div>
      <div class="form-group">
        <label>Archivo</label>
        <div class="preview-area" id="preview-area" onclick="document.getElementById('file-input').click()">
          <span>Haz clic para seleccionar</span>
          <img id="preview-img" />
          <video id="preview-video" muted controls></video>
          <audio id="preview-audio" controls></audio>
        </div>
        <input type="file" id="file-input" accept="image/*,video/*,audio/*" hidden />
      </div>
      <div class="form-group">
        <label>Etiquetas (separadas por coma)</label>
        <input type="text" id="upload-tags" placeholder="anime, arte, fanart" />
      </div>
      <div class="form-group">
        <label>Colección (tablero)</label>
        <select id="upload-collection">
          <option value="">Sin colección</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="App.closeUpload()">Cancelar</button>
        <button class="btn-primary" id="publish-btn" onclick="App.publish()">Publicar</button>
      </div>
    </div>
  </div>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox" onclick="if(event.target===this)App.closeLightbox()">
    <button class="lb-close" onclick="App.closeLightbox()">&times;</button>
    <div id="lb-media-container"></div>
    <div class="lb-info">
      <span class="lb-title" id="lb-title">Título</span>
      <div class="lb-actions">
        <button class="btn-success btn-sm" onclick="App.likeCurrent()">❤️ <span id="lb-likes">0</span></button>
        <button class="btn-danger btn-sm" id="lb-delete-btn" onclick="App.deleteCurrent()">🗑️ Eliminar</button>
        <button class="btn-secondary btn-sm" onclick="App.downloadCurrent()">⬇ Descargar</button>
      </div>
    </div>
    <div class="comments-section" id="lb-comments">
      <div id="comments-list"></div>
      <div class="comment-input">
        <input type="text" id="comment-input" placeholder="Escribe un comentario..." />
        <button class="btn-primary btn-sm" onclick="App.addComment()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>&copy; <strong>2026 JBK</strong> · Todos los derechos reservados · <span style="color:var(--muted)">Hecho con 💜</span></footer>

  <script>
    // ============================================================
    //  SUPABASE CLIENT
    // ============================================================
    const supabaseUrl = 'https://iqpucamkfdisjmuamhfe.supabase.co';
    const supabaseKey = 'sb_publishable_cyPcOMdiqZm__Lvf-qcIIA_tyy-eQK0';
    const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ============================================================
    //  APP
    // ============================================================
    const App = {
      currentUser: null,
      currentPost: null, // para lightbox
      authMode: 'login', // 'login' | 'register'
      isLiked: false,

      // ----- INIT -----
      async init() {
        // Obtener sesión actual
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          this.currentUser = session.user;
          this.updateAuthUI();
        }
        await this.loadPosts();
        this.loadCollections();
        this.setupRealtime();
        this.setupFileInput();
        this.setupCommentInput();
        this.setupTypeChange();
      },

      // ----- AUTENTICACIÓN -----
      toggleAuth() {
        const modal = document.getElementById('auth-modal');
        if (modal.classList.contains('active')) {
          modal.classList.remove('active');
          return;
        }
        modal.classList.add('active');
        document.getElementById('auth-email').value = '';
        document.getElementById('auth-password').value = '';
        this.authMode = 'login';
        document.getElementById('auth-modal-title').textContent = 'Iniciar sesión';
        document.getElementById('auth-submit').textContent = 'Entrar';
        document.getElementById('auth-toggle-link').textContent = '¿No tienes cuenta? Regístrate';
      },

      switchAuthMode() {
        this.authMode = this.authMode === 'login' ? 'register' : 'login';
        const title = document.getElementById('auth-modal-title');
        const btn = document.getElementById('auth-submit');
        const link = document.getElementById('auth-toggle-link');
        if (this.authMode === 'login') {
          title.textContent = 'Iniciar sesión';
          btn.textContent = 'Entrar';
          link.textContent = '¿No tienes cuenta? Regístrate';
        } else {
          title.textContent = 'Crear cuenta';
          btn.textContent = 'Registrarse';
          link.textContent = '¿Ya tienes cuenta? Inicia sesión';
        }
      },

      async submitAuth() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        if (!email || !password) {
          this.toast('⚠️ Completa todos los campos', true);
          return;
        }
        const btn = document.getElementById('auth-submit');
        btn.disabled = true;
        btn.textContent = '...';

        try {
          let result;
          if (this.authMode === 'login') {
            result = await sb.auth.signInWithPassword({ email, password });
          } else {
            result = await sb.auth.signUp({ email, password });
          }
          if (result.error) throw result.error;
          this.currentUser = result.data.user;
          this.updateAuthUI();
          document.getElementById('auth-modal').classList.remove('active');
          this.toast(this.authMode === 'login' ? '✅ Sesión iniciada' : '✅ Cuenta creada');
          await this.loadPosts(); // refrescar
        } catch (err) {
          this.toast('❌ ' + (err.message || 'Error de autenticación'), true);
        } finally {
          btn.disabled = false;
          btn.textContent = this.authMode === 'login' ? 'Entrar' : 'Registrarse';
        }
      },

      async logout() {
        await sb.auth.signOut();
        this.currentUser = null;
        this.updateAuthUI();
        this.toast('👋 Sesión cerrada');
        await this.loadPosts();
      },

      updateAuthUI() {
        const btn = document.getElementById('btn-auth');
        const userSpan = document.getElementById('auth-user');
        if (this.currentUser) {
          btn.textContent = '🚪 Cerrar sesión';
          btn.className = 'btn-outline';
          btn.onclick = () => this.logout();
          userSpan.textContent = '👤 ' + (this.currentUser.email || 'Usuario');
          userSpan.style.display = 'inline';
        } else {
          btn.textContent = '🔐 Iniciar sesión';
          btn.className = 'btn-primary';
          btn.onclick = () => this.toggleAuth();
          userSpan.style.display = 'none';
        }
      },

      // ----- PUBLICACIONES -----
      async loadPosts() {
        try {
          const { data, error } = await sb
            .from('posts')
            .select('*, likes(count)')
            .order('created_at', { ascending: false });
          if (error) throw error;
          this.setStatus(true, '☁️ Conectado');
          this.renderPosts(data || []);
        } catch (e) {
          console.error(e);
          this.setStatus(false, '⚠️ Error de conexión');
          this.renderPosts([]);
        }
      },

      renderPosts(posts) {
        const grid = document.getElementById('gallery-grid');
        if (!posts.length) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="icon">🖼️</div>
              <h3>La galería está vacía</h3>
              <p>Publica tu primera imagen, video o canción. ¡Anímate!</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = '';
        posts.forEach(post => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.id = post.id;

          // Media
          const mediaDiv = document.createElement('div');
          mediaDiv.className = 'card-media';
          const icon = document.createElement('span');
          icon.className = 'media-icon';
          if (post.type === 'image') {
            icon.textContent = '🖼️';
            const img = document.createElement('img');
            img.src = post.file_url;
            img.alt = post.title;
            img.loading = 'lazy';
            mediaDiv.appendChild(img);
          } else if (post.type === 'video') {
            icon.textContent = '🎬';
            const vid = document.createElement('video');
            vid.src = post.file_url;
            vid.muted = true;
            vid.playsInline = true;
            vid.preload = 'metadata';
            vid.onclick = (e) => e.stopPropagation();
            mediaDiv.appendChild(vid);
          } else if (post.type === 'audio') {
            icon.textContent = '🎵';
            const aud = document.createElement('audio');
            aud.src = post.file_url;
            aud.controls = true;
            aud.preload = 'metadata';
            aud.onclick = (e) => e.stopPropagation();
            mediaDiv.appendChild(aud);
          }
          mediaDiv.appendChild(icon);
          card.appendChild(mediaDiv);

          // Info
          const info = document.createElement('div');
          info.className = 'card-info';
          info.innerHTML = `
            <div class="card-title">${this.escapeHtml(post.title)}</div>
            <div class="card-meta">
              <span style="color:var(--muted);font-size:12px;">${post.type}</span>
              <button class="likes" data-id="${post.id}">❤️ <span>${post.likes?.[0]?.count || 0}</span></button>
            </div>
            <div class="card-actions">
              ${this.currentUser && post.user_id === this.currentUser.id ? `<button class="btn-danger btn-sm" onclick="App.deletePost('${post.id}')">🗑️</button>` : ''}
              ${post.tags && post.tags.length ? `<span style="font-size:11px;color:var(--muted);">#${post.tags.join(' #')}</span>` : ''}
            </div>
          `;
          card.appendChild(info);

          // Click para abrir lightbox
          card.addEventListener('click', () => this.openLightbox(post));

          grid.appendChild(card);
        });

        // Eventos de likes
        document.querySelectorAll('.card .likes').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            await this.toggleLike(id);
          });
        });
      },

      // ----- LIGHTBOX -----
      async openLightbox(post) {
        this.currentPost = post;
        this.isLiked = false;
        // Verificar si el usuario actual ya dio like
        if (this.currentUser) {
          const { data } = await sb
            .from('likes')
            .select('id')
            .eq('post_id', post.id)
            .eq('user_id', this.currentUser.id)
            .single();
          this.isLiked = !!data;
        }

        const container = document.getElementById('lb-media-container');
        container.innerHTML = '';
        const mediaEl = document.createElement('div');
        mediaEl.className = 'lb-media';
        if (post.type === 'image') {
          const img = document.createElement('img');
          img.src = post.file_url;
          img.alt = post.title;
          mediaEl.appendChild(img);
        } else if (post.type === 'video') {
          const vid = document.createElement('video');
          vid.src = post.file_url;
          vid.controls = true;
          vid.autoplay = true;
          vid.style.maxWidth = '90vw';
          mediaEl.appendChild(vid);
        } else if (post.type === 'audio') {
          const aud = document.createElement('audio');
          aud.src = post.file_url;
          aud.controls = true;
          aud.autoplay = true;
          aud.style.width = '100%';
          mediaEl.appendChild(aud);
        }
        container.appendChild(mediaEl);

        document.getElementById('lb-title').textContent = post.title;
        document.getElementById('lb-likes').textContent = post.likes?.[0]?.count || 0;

        // Botón eliminar
        const delBtn = document.getElementById('lb-delete-btn');
        if (this.currentUser && post.user_id === this.currentUser.id) {
          delBtn.style.display = 'inline-flex';
        } else {
          delBtn.style.display = 'none';
        }

        // Cargar comentarios
        await this.loadComments(post.id);

        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
      },

      closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
        this.currentPost = null;
        // pausar audios/videos
        document.querySelectorAll('.lb-media video, .lb-media audio').forEach(el => el.pause());
      },

      // ----- LIKES -----
      async toggleLike(postId) {
        if (!this.currentUser) {
          this.toast('⚠️ Inicia sesión para dar like', true);
          return;
        }
        try {
          if (this.isLiked) {
            // Quitar like
            await sb.from('likes').delete().eq('post_id', postId).eq('user_id', this.currentUser.id);
            this.isLiked = false;
          } else {
            await sb.from('likes').insert({ post_id: postId, user_id: this.currentUser.id });
            this.isLiked = true;
          }
          // Actualizar contador en UI (recargar posts)
          await this.loadPosts();
          // Si el lightbox está abierto, actualizar contador
          if (this.currentPost && this.currentPost.id === postId) {
            const { data } = await sb.from('posts').select('likes(count)').eq('id', postId).single();
            document.getElementById('lb-likes').textContent = data.likes?.[0]?.count || 0;
          }
        } catch (e) {
          console.error(e);
          this.toast('❌ Error al procesar like', true);
        }
      },

      likeCurrent() {
        if (!this.currentPost) return;
        this.toggleLike(this.currentPost.id);
      },

      // ----- COMENTARIOS -----
      async loadComments(postId) {
        const list = document.getElementById('comments-list');
        try {
          const { data, error } = await sb
            .from('comments')
            .select('*, users(email)')
            .eq('post_id', postId)
            .order('created_at', { ascending: true });
          if (error) throw error;
          list.innerHTML = '';
          data.forEach(c => {
            const div = document.createElement('div');
            div.className = 'comment';
            div.innerHTML = `
              <span class="user">${c.users?.email || 'Anónimo'}</span>
              <span class="content">${this.escapeHtml(c.content)}</span>
            `;
            list.appendChild(div);
          });
        } catch (e) {
          console.error(e);
        }
      },

      async addComment() {
        if (!this.currentUser) {
          this.toast('⚠️ Inicia sesión para comentar', true);
          return;
        }
        if (!this.currentPost) return;
        const input = document.getElementById('comment-input');
        const text = input.value.trim();
        if (!text) return;
        try {
          await sb.from('comments').insert({
            post_id: this.currentPost.id,
            user_id: this.currentUser.id,
            content: text
          });
          input.value = '';
          await this.loadComments(this.currentPost.id);
        } catch (e) {
          this.toast('❌ Error al comentar', true);
        }
      },

      setupCommentInput() {
        document.getElementById('comment-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.addComment();
        });
      },

      // ----- ELIMINAR -----
      async deletePost(postId) {
        if (!confirm('¿Seguro que quieres eliminar esta publicación?')) return;
        try {
          // Primero obtener la URL del archivo para borrarlo del storage
          const { data: post } = await sb.from('posts').select('file_url').eq('id', postId).single();
          if (post) {
            const path = post.file_url.split('/').pop();
            await sb.storage.from('media').remove([path]);
          }
          await sb.from('posts').delete().eq('id', postId);
          this.toast('🗑️ Publicación eliminada');
          await this.loadPosts();
          if (this.currentPost && this.currentPost.id === postId) {
            this.closeLightbox();
          }
        } catch (e) {
          console.error(e);
          this.toast('❌ Error al eliminar', true);
        }
      },

      deleteCurrent() {
        if (this.currentPost) {
          this.deletePost(this.currentPost.id);
        }
      },

      // ----- PUBLICAR -----
      openUpload() {
        if (!this.currentUser) {
          this.toast('⚠️ Inicia sesión para publicar', true);
          return;
        }
        document.getElementById('upload-title').value = '';
        document.getElementById('upload-tags').value = '';
        document.getElementById('upload-type').value = 'image';
        document.getElementById('preview-area').className = 'preview-area';
        document.getElementById('preview-img').src = '';
        document.getElementById('preview-video').src = '';
        document.getElementById('preview-audio').src = '';
        document.getElementById('file-input').value = '';
        this.loadCollections();
        document.getElementById('upload-modal').classList.add('active');
      },

      closeUpload() {
        document.getElementById('upload-modal').classList.remove('active');
      },

      setupFileInput() {
        document.getElementById('file-input').addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 50 * 1024 * 1024) {
            this.toast('⚠️ El archivo no puede superar 50 MB', true);
            e.target.value = '';
            return;
          }
          const type = document.getElementById('upload-type').value;
          const preview = document.getElementById('preview-area');
          const img = document.getElementById('preview-img');
          const vid = document.getElementById('preview-video');
          const aud = document.getElementById('preview-audio');

          // Limpiar
          img.style.display = 'none';
          vid.style.display = 'none';
          aud.style.display = 'none';
          img.src = '';
          vid.src = '';
          aud.src = '';

          const reader = new FileReader();
          reader.onload = (ev) => {
            if (type === 'image') {
              img.src = ev.target.result;
              img.style.display = 'block';
            } else if (type === 'video') {
              vid.src = ev.target.result;
              vid.style.display = 'block';
            } else if (type === 'audio') {
              aud.src = ev.target.result;
              aud.style.display = 'block';
            }
            preview.classList.add('has-media');
          };
          reader.readAsDataURL(file);

          // Guardar referencia
          this._uploadFile = file;
        });
      },

      setupTypeChange() {
        document.getElementById('upload-type').addEventListener('change', () => {
          // Resetear preview
          document.getElementById('file-input').value = '';
          document.getElementById('preview-area').className = 'preview-area';
          document.getElementById('preview-img').src = '';
          document.getElementById('preview-video').src = '';
          document.getElementById('preview-audio').src = '';
          this._uploadFile = null;
        });
      },

      async publish() {
        const title = document.getElementById('upload-title').value.trim();
        const type = document.getElementById('upload-type').value;
        const tagsRaw = document.getElementById('upload-tags').value.trim();
        const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
        const collectionId = document.getElementById('upload-collection').value;

        if (!title) { this.toast('⚠️ Escribe un título', true); return; }
        if (!this._uploadFile) { this.toast('⚠️ Selecciona un archivo', true); return; }

        const btn = document.getElementById('publish-btn');
        btn.disabled = true;
        btn.textContent = 'Subiendo...';

        try {
          // Subir archivo a Storage
          const ext = this._uploadFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 10)}.${ext}`;
          const { error: uploadErr } = await sb.storage
            .from('media')
            .upload(fileName, this._uploadFile, { contentType: this._uploadFile.type });
          if (uploadErr) throw uploadErr;

          const { data: publicUrl } = sb.storage.from('media').getPublicUrl(fileName);

          // Insertar en posts
          const { error: insertErr } = await sb.from('posts').insert({
            title,
            type,
            file_url: publicUrl.publicUrl,
            user_id: this.currentUser.id,
            tags,
            collection_id: collectionId || null,
          });
          if (insertErr) throw insertErr;

          this.closeUpload();
          this.toast('✅ Publicado correctamente');
          await this.loadPosts();
        } catch (e) {
          console.error(e);
          this.toast('❌ ' + (e.message || 'Error al publicar'), true);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Publicar';
        }
      },

      // ----- COLECCIONES (tableros) -----
      async loadCollections() {
        if (!this.currentUser) return;
        try {
          const { data, error } = await sb
            .from('collections')
            .select('*')
            .eq('user_id', this.currentUser.id);
          if (error) throw error;
          const select = document.getElementById('upload-collection');
          select.innerHTML = '<option value="">Sin colección</option>';
          data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            select.appendChild(opt);
          });
        } catch (e) {
          console.error(e);
        }
      },

      // ----- DESCARGA -----
      downloadCurrent() {
        if (!this.currentPost) return;
        const url = this.currentPost.file_url;
        const name = this.currentPost.title.replace(/[^a-zA-Z0-9]/g, '_') + '.' + url.split('.').pop();
        fetch(url)
          .then(r => r.blob())
          .then(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            URL.revokeObjectURL(a.href);
          })
          .catch(() => this.toast('❌ Error al descargar', true));
      },

      // ----- REALTIME -----
      setupRealtime() {
        sb.channel('posts-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => this.loadPosts())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, () => this.loadPosts())
          .subscribe();
      },

      // ----- UTILS -----
      setStatus(ok, txt) {
        const el = document.getElementById('cloud-status');
        el.textContent = txt;
        el.className = 'cloud-status ' + (ok ? 'ok' : 'bad');
      },

      escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      },

      toast(msg, err = false) {
        const old = document.querySelector('.toast');
        if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'toast' + (err ? ' error' : '');
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      },
    };

    // ============================================================
    //  ARRANQUE
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => App.init());

    // Cerrar modales con ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay, .lightbox').forEach(el => el.classList.remove('active'));
        document.body.style.overflow = '';
      }
    });

    // Click fuera del modal para cerrar
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });
  </script>
</body>
</html>
